plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = "ToggleItemFrames263-1.20.1-fabric" }
repositories { }
loom { mods { "toggleitemframes263_1201" { sourceSet sourceSets.main } } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped" } }
tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
jar { def projectName = project.name; from("LICENSE") { rename { "${it}_$projectName" } } }
publishing { publications { create("mavenJava", MavenPublication) { from components.java } }; repositories { } }
